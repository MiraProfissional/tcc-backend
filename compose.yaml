services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-app
    volumes:
      - .:/usr/src/app
    ports:
      - '3000:3000'
    depends_on:
      - postgres_db
    env_file:
      - .env
    

  postgres_db:
    image: postgres
    restart: on-failure
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    container_name: tcc-postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  pgdata: